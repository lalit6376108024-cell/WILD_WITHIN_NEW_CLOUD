databases:
  - name: wild-within-cloud-db
    databaseName: wild_within
    user: wild_within_user
    plan: free

services:
  - type: web
    name: wild-within-new
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: wild-within-cloud-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ACCESS_PASSWORD
        generateValue: true
      - key: SYNC_TOKEN
        generateValue: true
